; Copy to pool.ini. Never commit pool.ini or WireGuard configs.

[proxy]
bind = 127.0.0.1
port = 8080
strategy = round
max_fails = 3
fail_timeout = 60
connect_timeout = 25
allowed_ips =
auth_enabled = false
auth_username =
auth_password_hash =

[probe]
enabled = true
interval = 30
target = https://api64.ipify.org/
timeout = 15

[rotation]
interval_minutes = 0

[exit]
ipv6_only = false

[wireproxy]
binary = wireproxy
config_dir = configs
base_socks_port = 10800

[web]
bind = 127.0.0.1
port = 9099
username = admin
password_hash =
session_ttl = 43200

[tunnels]
disabled =
